<!DOCTYPE html>
<html>
<head>
  <script>
    // Get ?url= parameter from the extension
    const params = new URLSearchParams(window.location.search);
    const target = params.get("url");

    if (target) {
      window.location.href = target;
    } else {
      document.body.innerHTML = "No URL provided.";
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
